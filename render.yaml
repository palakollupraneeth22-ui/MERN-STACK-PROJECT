services:
  # 1. Backend Service
  - type: web
    name: course-progress-backend
    env: node
    rootDir: backend/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true # Generates a secure random key automatically!
      - key: JWT_REFRESH_SECRET
        generateValue: true # Generates a secure random key automatically!
      - key: CORS_ORIGIN
        fromService:
          name: course-progress-frontend
          type: static
          property: url
      - key: FRONTEND_URL
        fromService:
          name: course-progress-frontend
          type: static
          property: url
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # Paste the full firebase-service-account.json content as a JSON string
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  # 2. Frontend Service
  - type: static
    name: course-progress-frontend
    rootDir: frontend/client
    buildCommand: npm install && npm run build
    publishDir: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      # Rewrites all requests to index.html for React Router compatibility
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: course-progress-backend
          type: web
          property: url
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
